name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      CARGO_LLVM_COV_VERSION: 0.8.6
      EMEL_COVERAGE_TOOLCHAIN: nightly-2026-07-12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy,rustfmt
      - name: Install coverage toolchain
        run: rustup toolchain install "$EMEL_COVERAGE_TOOLCHAIN" --profile minimal --component llvm-tools-preview
      - uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/cargo-llvm-cov
          key: cargo-llvm-cov-bin-${{ env.CARGO_LLVM_COV_VERSION }}-${{ env.EMEL_COVERAGE_TOOLCHAIN }}
      - run: echo "${{ runner.tool_cache }}/cargo-llvm-cov/bin" >> "$GITHUB_PATH"
      - name: Install cargo-llvm-cov
        run: |
          if ! command -v cargo-llvm-cov >/dev/null 2>&1; then
            cargo +"$EMEL_COVERAGE_TOOLCHAIN" install \
              --root "${{ runner.tool_cache }}/cargo-llvm-cov" \
              --version "$CARGO_LLVM_COV_VERSION" cargo-llvm-cov --locked
          fi
      - uses: actions/cache@v4
        with:
          path: target/llvm-cov-target
          key: coverage-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            coverage-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-
      - uses: actions/cache@v4
        with:
          path: target/gguf-parity/llama-reference
          key: gguf-parity-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/llama-gguf-reference/**') }}
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo lint
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --bins -- -D warnings
      - run: cargo test-all
      - run: cargo test --locked --workspace --doc --all-features
      - run: scripts/tests/bench_io_read_artifact.sh
      - run: scripts/tests/bench_io_mmap_artifact.sh
      - run: bash scripts/tests/bench_io_staged_read_artifact.sh
      - name: Coverage gate (90% lines, 50% branches)
        run: scripts/coverage.sh
      - run: scripts/paritychecker.sh
      - run: git diff --exit-code -- snapshots/parity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emel-gguf-coverage-${{ github.sha }}
          path: target/coverage/emel-gguf.json
          if-no-files-found: error

  fuzz-smoke:
    runs-on: ubuntu-latest
    env:
      CARGO_FUZZ_VERSION: 0.13.2
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/cargo-fuzz
          key: cargo-fuzz-bin-${{ env.CARGO_FUZZ_VERSION }}
      - run: echo "${{ runner.tool_cache }}/cargo-fuzz/bin" >> "$GITHUB_PATH"
      - name: Install cargo-fuzz
        run: |
          if ! command -v cargo-fuzz >/dev/null 2>&1; then
            cargo +nightly install --root "${{ runner.tool_cache }}/cargo-fuzz" \
              --version "$CARGO_FUZZ_VERSION" cargo-fuzz --locked
          fi
      - run: scripts/fuzz.sh --seconds 10
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gguf-fuzz-artifacts-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore

  mmap-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy,rustfmt
      - run: cargo test --locked -p emel-io --lib mmap
      - run: cargo test --locked -p emel-io --test mmap
      - run: cargo test --locked -p emel-io --test mmap_architecture

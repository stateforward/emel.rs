[package]
name = "emel-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
emel-gguf = { path = "../crates/emel-gguf" }
emel-io = { path = "../crates/emel-io" }
emel-kernels = { path = "../crates/emel-kernels" }
emel-model = { path = "../crates/emel-model" }
emel-tensor = { path = "../crates/emel-tensor" }
emel-token = { path = "../crates/emel-token" }
libfuzzer-sys = "0.4.13"

[[bin]]
name = "gguf_loader"
path = "fuzz_targets/gguf_loader.rs"
test = false
doc = false
bench = false

